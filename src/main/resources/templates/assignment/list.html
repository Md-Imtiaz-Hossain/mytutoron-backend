<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/stylesheets::head">

<body class="hold-transition sidebar-mini">
<div class="wrapper">

    <!-- Navbar -->
    <nav class="main-header navbar navbar-expand navbar-white navbar-light">
        <!-- Left navbar links -->
        <ul th:replace="fragments/header::leftNavbar"></ul>
        <!-- Right navbar links -->
        <ul th:replace="fragments/header::rightNavbar"></ul>
    </nav>

    <!-- Main Sidebar Container -->
    <aside class="main-sidebar sidebar-dark-primary elevation-4">
        <!-- Brand Logo -->
        <a th:replace="fragments/sidebar::brandLogo"></a>
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Sidebar Menu -->
            <nav th:replace="fragments/sidebar::sidebarMenu"></nav>
        </div>
    </aside>

    <!-- Content Wrapper. Contains page content -->
    <div class="content-wrapper">
        <div class="content-header">
            <div class="container-fluid">
                <div class="row mb-2">
                    <div class="col-sm-6">
                        <h1 class="m-0" style="display: inline-block">Assignments</h1>
                        <a class="btn btn-primary ml-3" th:href="@{/assignments/create}"><i class="fas fa-plus mr-2"></i> Add</a>
                    </div>
                </div>
            </div>
        </div>
        <hr style="margin: 0; padding: 0">

        <!-- Starting Book Table -->
        <div class="book-table p-3">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Assignment List</h3>
                </div>
                <div class="card-body p-0">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>Assignment Title</th>
                            <th>Additional Note</th>
                            <th>Category</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="assignment : ${assignments}">
                            <td th:text="${assignment.assignmentTitle}"></td>
                            <td th:text="${assignment.additionalNote}"></td>
                            <td th:text="${assignment.assignmentCategory != null ? assignment.assignmentCategory.name : ''}"></td>
                            <td>
                                <a class="btn btn-sm btn-success" th:href="@{/assignments/{id}/ (id = ${assignment.id})}"><i
                                        class="fas fa-eye"></i></a>
                                <a class="btn btn-sm btn-primary" th:href="@{'/assignments/' + ${assignment.id} + '/update'}"><i
                                        class="fas fa-pen"></i></a>
                                <a class="btn btn-sm btn-danger" href="#"
                                   th:onclick="deleteItem([[${assignment.id}]], '/assignments/', 'assignment')"> <i
                                        class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="fragments/body-content::pagination"></div>
            </div>
        </div>
    </div>
    <!-- Main Footer -->
    <footer class="main-footer" th:replace="fragments/footer::footer"></footer>
</div>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
